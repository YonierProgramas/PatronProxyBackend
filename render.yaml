# Authorized free-tier variant: four independent web services and expiring Free Postgres.
# Enter real public HTTPS business origins and CORS when prompted. No paid resource is selected.
services:
- type: web
  name: inventory-service
  runtime: docker
  repo: https://github.com/YonierProgramas/PatronProxyBackend
  branch: main
  region: oregon
  plan: free
  numInstances: 1
  dockerfilePath: ./Dockerfile.inventory-service
  dockerContext: .
  autoDeployTrigger: 'off'
  healthCheckPath: /actuator/health
  envVars:
  - key: PORT
    value: '10000'
  - key: SPRING_PROFILES_ACTIVE
    value: prod
  - key: INTERNAL_SERVICE_TOKEN
    generateValue: true
- type: web
  name: order-service
  runtime: docker
  repo: https://github.com/YonierProgramas/PatronProxyBackend
  branch: main
  region: oregon
  plan: free
  numInstances: 1
  dockerfilePath: ./Dockerfile.order-service
  dockerContext: .
  autoDeployTrigger: 'off'
  healthCheckPath: /actuator/health
  envVars:
  - key: PORT
    value: '10000'
  - key: SPRING_PROFILES_ACTIVE
    value: prod
  - key: INTERNAL_SERVICE_TOKEN
    fromService:
      type: web
      name: inventory-service
      envVarKey: INTERNAL_SERVICE_TOKEN
- type: web
  name: payment-service
  runtime: docker
  repo: https://github.com/YonierProgramas/PatronProxyBackend
  branch: main
  region: oregon
  plan: free
  numInstances: 1
  dockerfilePath: ./Dockerfile.payment-service
  dockerContext: .
  autoDeployTrigger: 'off'
  healthCheckPath: /actuator/health
  envVars:
  - key: PORT
    value: '10000'
  - key: SPRING_PROFILES_ACTIVE
    value: prod
  - key: INTERNAL_SERVICE_TOKEN
    fromService:
      type: web
      name: inventory-service
      envVarKey: INTERNAL_SERVICE_TOKEN
- type: web
  name: monitor-api
  runtime: docker
  repo: https://github.com/YonierProgramas/PatronProxyBackend
  branch: main
  region: oregon
  plan: free
  numInstances: 1
  dockerfilePath: ./Dockerfile.monitor-api
  dockerContext: .
  autoDeployTrigger: 'off'
  healthCheckPath: /actuator/health
  envVars:
  - key: PORT
    value: '10000'
  - key: SPRING_PROFILES_ACTIVE
    value: prod
  - key: INTERNAL_SERVICE_TOKEN
    fromService:
      type: web
      name: inventory-service
      envVarKey: INTERNAL_SERVICE_TOKEN
  - key: CORS_ALLOWED_ORIGINS
    sync: false
  - key: INTERNAL_TIMEOUT_MS
    value: '10000'
  - key: SIMULATION_COOLDOWN_MS
    value: '10000'
  - key: DB_MAX_POOL_SIZE
    value: '5'
  - key: INVENTORY_SERVICE_URL
    sync: false
  - key: ORDER_SERVICE_URL
    sync: false
  - key: PAYMENT_SERVICE_URL
    sync: false
  - key: PGHOST
    fromDatabase:
      name: proxy-audit-db
      property: host
  - key: PGPORT
    fromDatabase:
      name: proxy-audit-db
      property: port
  - key: PGDATABASE
    fromDatabase:
      name: proxy-audit-db
      property: database
  - key: SPRING_DATASOURCE_USERNAME
    fromDatabase:
      name: proxy-audit-db
      property: user
  - key: SPRING_DATASOURCE_PASSWORD
    fromDatabase:
      name: proxy-audit-db
      property: password
databases:
- name: proxy-audit-db
  region: oregon
  plan: free
  databaseName: proxy_audit
  user: proxy_audit_app
  postgresMajorVersion: '16'
  ipAllowList: []
