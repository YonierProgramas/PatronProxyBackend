spring.application.name=monitor-api
server.port=${PORT:8080}
server.tomcat.threads.max=20
server.tomcat.max-http-form-post-size=32KB
server.tomcat.max-swallow-size=32KB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
spring.profiles.default=local
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8081}
order.service.url=${ORDER_SERVICE_URL:http://localhost:8082}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8083}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
internal.timeout.ms=${INTERNAL_TIMEOUT_MS:3000}
simulation.cooldown.ms=${SIMULATION_COOLDOWN_MS:10000}
server.address=0.0.0.0
internal.service.token=${INTERNAL_SERVICE_TOKEN:}
